name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [management-service, gateway-service, sample-backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build and test
        run: mvn -B verify
        working-directory: ${{ matrix.service }}
      - name: Build Docker image
        run: docker build -t ${{ matrix.service }}:${{ github.sha }} ${{ matrix.service }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install && npm run build
        working-directory: frontend

  full-stack-test:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the full stack
        run: docker compose up -d --build
      - name: Run the smoke test
        run: bash scripts/smoke-test.sh http://localhost:8080
      - name: Show service logs if the test failed
        if: failure()
        run: docker compose logs --tail=60
      - name: Stop the stack
        if: always()
        run: docker compose down -v

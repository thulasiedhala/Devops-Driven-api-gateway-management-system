name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [management-service, gateway-service, sample-backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build and test
        run: mvn -B verify
        working-directory: ${{ matrix.service }}
      - name: Build Docker image
        run: docker build -t ${{ matrix.service }}:${{ github.sha }} ${{ matrix.service }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install && npm run build
        working-directory: frontend

  deploy-check:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test full stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST localhost:8080/api/auth/login \
              -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin123"}') && [ "$code" = "200" ] && exit 0
            sleep 5
          done
          docker compose logs && exit 1

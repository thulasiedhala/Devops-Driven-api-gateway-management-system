server:
  port: 8081
spring:
  application:
    name: management-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gatewaydb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
  jpa:
    hibernate:
      ddl-auto: update
jwt:
  secret: ${JWT_SECRET:change-this-secret-key-at-least-32-bytes-long-123}
  expiration-ms: 3600000
app:
  internal-key: ${INTERNAL_KEY:internal-secret}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

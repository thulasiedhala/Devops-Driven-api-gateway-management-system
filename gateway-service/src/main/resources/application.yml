server:
  port: 8080
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      metrics:
        enabled: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: management-service
          uri: ${MANAGEMENT_URL:http://localhost:8081}
          predicates:
            - Path=/api/**
jwt:
  secret: ${JWT_SECRET:change-this-secret-key-at-least-32-bytes-long-123}
app:
  management-url: ${MANAGEMENT_URL:http://localhost:8081}
  internal-key: ${INTERNAL_KEY:internal-secret}
  default-rate-limit-per-min: 100
  route-sync-ms: 15000
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
